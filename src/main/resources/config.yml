# TrTown 默认配置（对应 PLAN §5.7）
# 改动后执行 /trtown admin reload 生效（storage 项需要重启）。

storage:
  type: sqlite                      # sqlite / mysql
  sqlite-pool-size: 2               # SQLite 并发写会锁库，池子保持 1-2
  mysql:
    host: localhost
    port: 3306
    database: trtown
    user: root
    password: ""
    pool-size: 10

town:
  max-members: 20
  max-towns-per-player: 1
  name-regex: "^[A-Za-z0-9_\\u4e00-\\u9fa5]{3,16}$"
  invite-expire-seconds: 300
  max-pending-invites: 50
  disband-confirm-seconds: 10
  transfer-confirm-seconds: 10      # 已绑定主领地时，转让镇长需二次确认的窗口
  transfer-demote-to: MEMBER        # 转让后原镇长降为 MEMBER 或 MANAGER

prefix:
  enabled: true
  max-length: 16                    # 去掉颜色码后的可见字符数
  allow-color: true                 # 允许 & 颜色码
  display-format: "&8[&b%s&8] &r"   # %s = 前缀原文，最终由 PAPI 变量 %trtown_prefix% 输出
  fallback-to-name: true            # 未设置前缀时用镇名
  cooldown-seconds: 0               # 0 = 随时可改
  deny-chars: ["%", "{", "}", "[", "]", "§"]   # 命中即拒绝（防 PAPI 递归 / 伪造系统标签）

dominion:
  # v1.25（PLAN §5.16.1）：不再创建 Dominion 权限组。
  # 每个角色只配置 Dominion flags.yml 里的**预设组名**，启动时从
  # plugins/Dominion/flags.yml 的 groups.privilege.<名称>.flags 展开。
  # 空列表 = 该角色不设任何 flag。
  roles:
    MEMBER:
      presets: [teleport]     # M-44（AUDIT §24.10）：只给"回自己家"的门票，不含建筑/容器/管理
    MANAGER:
      presets: [administration]  # admin + resize + rename_dominion + 6 项子领地操作，共 7 项
    MAYOR:
      presets: []              # 继承 MEMBER + MANAGER；当前无额外项

teleport:
  allow-others: true                # false → /tt tp <镇名> 一律拒绝（只允许传送回自己镇）

gui:
  enabled: true                     # false → /tt 回退文字帮助，所有菜单入口关闭
  refresh-seconds: 3                # 占位：菜单按"点击时重开"刷新

sync:
  poll-ticks: 20
  max-attempts: 5
  backoff-seconds: [5, 30, 120, 600]
